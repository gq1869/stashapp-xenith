version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    # Xenith is a Stash plugin: React itself comes from the Stash host at
    # runtime (currently React 17), not from this package. @types/react must
    # track that runtime version, not npm's latest major.
    ignore:
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
    groups:
      # eslint/stylelint plugins and configs are peer-dependency coupled to
      # their core package. A major bump proposed alone (e.g. eslint 9->10
      # without eslint-plugin-react, or stylelint-config-standard 39->40
      # without stylelint 16->17) fails `npm ci` with ERESOLVE. Grouping these
      # families (patch/minor/major) makes dependabot bump them together so
      # the PR either resolves cleanly or fails as one visible unit instead of
      # landing as unmergeable half-changes. Declared before the catch-all
      # dev-dependencies group below, since dependabot assigns each dependency
      # to the first group it matches.
      eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "eslint-plugin-*"
      stylelint:
        patterns:
          - "stylelint"
          - "stylelint-config-*"
          - "stylelint-order"
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "patch"
          - "minor"

  - package-ecosystem: "npm"
    directory: "/qa"
    schedule:
      interval: "monthly"
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "patch"
          - "minor"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
