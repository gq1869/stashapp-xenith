name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Check version matches tag
        run: bash .github/scripts/check-version.sh "${GITHUB_REF_NAME}"
      - run: npm run build
      - name: Stage plugin bundle
        run: bash .github/scripts/stage-plugin.sh _bundle/xenith
      - name: Build zip
        working-directory: _bundle
        run: zip -r ../xenith.zip xenith -x "*__pycache__*"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          if bash .github/scripts/extract-notes.sh "${GITHUB_REF_NAME}" notes.md; then
            gh release create "${GITHUB_REF_NAME}" xenith.zip --notes-file notes.md $PRERELEASE_FLAG
          else
            gh release create "${GITHUB_REF_NAME}" xenith.zip --generate-notes $PRERELEASE_FLAG
          fi
