name: Bug report
description: Something in Xenith isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: xenith-version
    attributes:
      label: Xenith version
      placeholder: e.g. 3.0.0
    validations:
      required: true

  - type: input
    id: stash-version
    attributes:
      label: Stash version
      placeholder: e.g. v0.28.1
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser / OS
      placeholder: e.g. Chrome 128 on macOS 15
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or console output
      render: shell
    validations:
      required: false
